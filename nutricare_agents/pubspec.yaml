name: nutricare_agents
description: A Flutter mobile app for NutriCare Agents.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_storage: ^11.6.5
  google_sign_in: ^6.2.1
  equatable: ^2.0.7
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^10.7.0  # State management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # UI components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Animation
  lottie: ^2.7.0
  
  # HTTP and API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Local storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Google services
  google_generative_ai: ^0.2.0
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  flutter_markdown: ^0.6.18
  
  # Speech recognition
  speech_to_text: ^6.5.1
  
  # Charts
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/